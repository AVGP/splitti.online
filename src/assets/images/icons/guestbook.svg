<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Book Cover -->
  <rect x="4" y="4" width="20" height="24" fill="#008080" stroke="#000000" stroke-width="1"/>
  <!-- Spine -->
  <rect x="4" y="4" width="4" height="24" fill="#004040" stroke="#000000" stroke-width="1"/>
  <!-- Paper Edge -->
  <rect x="23" y="6" width="2" height="20" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  <!-- Label Plaque -->
  <rect x="10" y="8" width="11" height="6" fill="#FFFFCC" stroke="#000000" stroke-width="1"/>
  <rect x="12" y="10" width="7" height="1" fill="#000080"/>
  <rect x="12" y="12" width="5" height="1" fill="#808080"/>
  <!-- Classic Pen/Quill -->
  <polygon points="18,22 27,10 29,12 20,24" fill="#FBBF24" stroke="#000000" stroke-width="1"/>
  <polygon points="18,22 20,24 16,26" fill="#1F2937"/>
</svg>
