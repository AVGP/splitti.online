<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Book Cover -->
  <rect x="5" y="4" width="22" height="24" rx="2" fill="#7C3AED" stroke="#000000" stroke-width="1"/>
  <!-- Spine -->
  <rect x="5" y="4" width="4" height="24" fill="#4C1D95" />
  <!-- Bookmark Ribbon -->
  <polygon points="18,4 21,4 21,14 19.5,12 18,14" fill="#EF4444" />
  <!-- Lock badge -->
  <circle cx="16" cy="18" r="3" fill="#FBBF24" stroke="#000" stroke-width="0.5"/>
</svg>
